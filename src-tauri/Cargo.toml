[package]
name = "todometro"
version = "1.0.0"
description = "Cronometro y contador minimalista con historial local"
authors = ["tprxd07"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
