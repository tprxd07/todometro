name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            platform: windows-latest
            args: "--bundles msi,nsis"
            artifact_paths: |
              src-tauri/target/release/bundle/msi/*.msi
              src-tauri/target/release/bundle/nsis/*.exe
          - name: linux-x64
            platform: ubuntu-22.04
            args: "--bundles appimage,deb,rpm"
            artifact_paths: |
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/rpm/*.rpm
          - name: macos-x64
            platform: macos-15-intel
            args: "--bundles app,dmg"
            artifact_paths: src-tauri/target/release/bundle/dmg/*.dmg
          - name: macos-arm64
            platform: macos-15
            args: "--bundles app,dmg"
            artifact_paths: src-tauri/target/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2 \
            rpm

      - name: Install npm dependencies
        run: npm ci

      - name: Build
        uses: tauri-apps/tauri-action@v0
        with:
          args: ${{ matrix.args }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.artifact_paths }}
          if-no-files-found: error
          retention-days: 3

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare stable asset names
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          while IFS= read -r -d '' file; do
            case "$file" in
              artifacts/windows-x64/*.msi)
                cp "$file" release-assets/TODOmetro-Windows-x64.msi
                ;;
              artifacts/windows-x64/*.exe)
                cp "$file" release-assets/TODOmetro-Windows-x64-Setup.exe
                ;;
              artifacts/linux-x64/*.AppImage)
                cp "$file" release-assets/TODOmetro-Linux-x86_64.AppImage
                ;;
              artifacts/linux-x64/*.deb)
                cp "$file" release-assets/TODOmetro-Linux-amd64.deb
                ;;
              artifacts/linux-x64/*.rpm)
                cp "$file" release-assets/TODOmetro-Linux-x86_64.rpm
                ;;
              artifacts/macos-x64/*.dmg)
                cp "$file" release-assets/TODOmetro-macOS-x64.dmg
                ;;
              artifacts/macos-arm64/*.dmg)
                cp "$file" release-assets/TODOmetro-macOS-arm64.dmg
                ;;
            esac
          done < <(find artifacts -type f -print0)
          (cd release-assets && sha256sum * > SHA256SUMS.txt)
          ls -lh release-assets

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber
          else
            gh release create "$TAG" release-assets/* \
              --title "TODOmetro $TAG" \
              --notes-file .github/release-notes.md \
              --latest
          fi
