<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="TODOmetro: cronómetro y contador minimalista con historial local.">
  <title>TODOmetro</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="resize-handle resize-n" data-resize="North" aria-hidden="true"></div>
  <div class="resize-handle resize-s" data-resize="South" aria-hidden="true"></div>
  <div class="resize-handle resize-e" data-resize="East" aria-hidden="true"></div>
  <div class="resize-handle resize-w" data-resize="West" aria-hidden="true"></div>
  <div class="resize-handle resize-ne" data-resize="NorthEast" aria-hidden="true"></div>
  <div class="resize-handle resize-nw" data-resize="NorthWest" aria-hidden="true"></div>
  <div class="resize-handle resize-se" data-resize="SouthEast" aria-hidden="true"></div>
  <div class="resize-handle resize-sw" data-resize="SouthWest" aria-hidden="true"></div>

  <header class="titlebar">
    <div class="drag-zone" data-tauri-drag-region>
      <span class="app-name" data-tauri-drag-region>TODOmetro</span>
    </div>
    <div class="titlebar-actions">
      <button id="btnHistory" class="tb-btn" type="button" aria-label="Abrir historial" title="Historial">
        <svg class="icon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false">
          <circle cx="12" cy="12" r="8.25" fill="none" stroke="currentColor" stroke-width="1.7"/>
          <path d="M12 7.5V12l3 2" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <button id="btnPin" class="tb-btn active" type="button" aria-label="Desanclar ventana" aria-pressed="true" title="Siempre visible">
        <svg class="icon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false">
          <path d="M9 3h6l-1 5 4 4v1h-5v6l-1 2-1-2v-6H6v-1l4-4-1-5z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
        </svg>
      </button>
      <button id="btnMin" class="tb-btn" type="button" aria-label="Minimizar" title="Minimizar">
        <svg class="icon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false">
          <path d="M6 12.5h12" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
        </svg>
      </button>
      <button id="btnClose" class="tb-btn tb-close" type="button" aria-label="Cerrar" title="Cerrar">
        <svg class="icon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false">
          <path d="M7 7l10 10M17 7L7 17" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
  </header>

  <main class="app">
    <nav class="modes" aria-label="Modo de temporizador">
      <button id="modeStopwatch" class="mode-btn active" type="button" aria-label="Cronómetro" aria-pressed="true">Cronómetro</button>
      <button id="modeCountdown" class="mode-btn" type="button" aria-label="Contador" aria-pressed="false">Contador</button>
    </nav>

    <section class="dial-wrap" aria-label="Tiempo">
      <svg class="dial" id="dial" viewBox="0 0 200 200" aria-hidden="true" focusable="false">
        <circle class="dial-track" cx="100" cy="100" r="94"/>
        <circle class="dial-progress" id="dialProgress" cx="100" cy="100" r="94" transform="rotate(-90 100 100)"/>
      </svg>
      <div class="dial-content">
        <div id="timeDisplay" class="time-display">
          <span id="timeMain" class="time-main">00:00:00</span><span id="timeMs" class="time-ms">.000</span>
        </div>
        <div id="durationInputs" class="duration-inputs" hidden>
          <input id="inputMin" class="dur-input" type="number" min="0" max="99" step="1" inputmode="numeric" value="05" aria-label="Minutos" placeholder="MM">
          <span class="dur-colon" aria-hidden="true">:</span>
          <input id="inputSec" class="dur-input" type="number" min="0" max="59" step="1" inputmode="numeric" value="00" aria-label="Segundos" placeholder="SS">
        </div>
      </div>
    </section>

    <div class="controls">
      <button id="btnToggle" class="ctrl ctrl-primary" type="button" aria-label="Iniciar" title="Iniciar">
        <svg class="icon icon-play" viewBox="0 0 24 24" width="21" height="21" aria-hidden="true" focusable="false">
          <path d="M8.5 5.6v12.8L19 12z" fill="currentColor"/>
        </svg>
        <svg class="icon icon-pause" viewBox="0 0 24 24" width="21" height="21" aria-hidden="true" focusable="false">
          <rect x="7" y="5.5" width="3.6" height="13" rx="1" fill="currentColor"/>
          <rect x="13.4" y="5.5" width="3.6" height="13" rx="1" fill="currentColor"/>
        </svg>
      </button>
      <button id="btnReset" class="ctrl" type="button" aria-label="Reiniciar" title="Reiniciar">
        <svg class="icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
          <path d="M18.4 12a6.4 6.4 0 1 1-1.9-4.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
          <path d="M18.6 5.6v4h-4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <button id="btnLap" class="ctrl" type="button" aria-label="Añadir bandera" title="Añadir bandera">
        <svg class="icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
          <path d="M6 21V4.2" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
          <path d="M6 5h11.5l-2.1 3.6 2.1 3.6H6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>

    <section id="marksPanel" class="marks" aria-label="Marcas de la sesión">
      <ol id="marksList" class="marks-list"></ol>
      <p id="marksEmpty" class="marks-empty">Sin banderas</p>
    </section>
  </main>

  <div id="historyOverlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="historyTitle" hidden>
    <header class="overlay-top">
      <h2 id="historyTitle">Historial</h2>
      <button id="btnHistoryClose" class="tb-btn overlay-close" type="button" aria-label="Cerrar historial" title="Cerrar historial">
        <svg class="icon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false">
          <path d="M7 7l10 10M17 7L7 17" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
        </svg>
      </button>
    </header>
    <div class="overlay-content">
      <section class="history-section">
        <h3>Cronómetros</h3>
        <div id="historyStopwatch" class="history-list"></div>
      </section>
      <section class="history-section">
        <h3>Contadores</h3>
        <div id="historyCountdown" class="history-list"></div>
      </section>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
